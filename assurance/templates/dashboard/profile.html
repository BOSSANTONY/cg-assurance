{% extends "base.html" %}

{% block title %}
Mon profil | CG-Assurance
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>
            Mon profil
        </h2>

        <p class="text-muted">
            Gérez vos informations personnelles.
        </p>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn btn-primary-custom w-100"
            >
                Enregistrer
            </button>

        </form>

    </div>

</div>

{% endblock %}
