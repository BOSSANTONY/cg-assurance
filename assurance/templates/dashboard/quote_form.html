{% extends "base.html" %}

{% block title %}
Demander un devis | CG-Assurance
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>
            Demander un devis
        </h2>

        <p class="text-muted">
            Décrivez votre besoin et notre équipe
            vous recontactera.
        </p>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn btn-primary-custom w-100"
            >
                Envoyer ma demande
            </button>

        </form>

    </div>

</div>

{% endblock %}
